version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/research_papers}
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploaded_papers}
      - LLM_TYPE=${LLM_TYPE:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - VECTOR_SIZE=${VECTOR_SIZE:-768}
    ports:
      - "8000:8000"
    volumes:
      - api_uploads:/app/uploaded_papers
    depends_on:
      - db
      - qdrant

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-streamlit
    env_file:
      - .env
    environment:
      - API_BASE=${API_BASE:-http://api:8000/api}
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.port", "8501", "--server.headless", "true", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - api_uploads:/app/uploaded_papers
    depends_on:
      - api

  db:
    image: postgres:16
    container_name: rag-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=research_papers
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
  api_uploads:
